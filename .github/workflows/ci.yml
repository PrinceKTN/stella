name: CI

on:
  push:
    branches: [main, hermes-dev]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on all .sh files
        run: |
          find . -name "*.sh" -type f ! -path "./.git/*" | xargs shellcheck -x

  shfmt:
    name: shfmt (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check formatting
        run: |
          find . -name "*.sh" -type f ! -path "./.git/*" | xargs shfmt -d

  bats:
    name: Bats Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            find tests -name "*.bats" -type f | xargs bats
          else
            echo "No bats tests found"
          fi

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: Lint Python files
        run: |
          find . -name "*.py" -type f ! -path "./.git/*" | xargs ruff check

  validate-json:
    name: Validate JSON Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name "*.json" -type f ! -path "./.git/*" ! -path "./node_modules/*" | xargs -I{} sh -c 'python3 -m json.tool {} > /dev/null && echo "OK: {}" || (echo "INVALID: {}" && exit 1)'

  preflight:
    name: Stella Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run preflight check
        run: |
          if [ -f "./stella-preflight.sh" ]; then
            chmod +x ./stella-preflight.sh
            ./stella-preflight.sh || true
          else
            echo "No preflight script found"
          fi